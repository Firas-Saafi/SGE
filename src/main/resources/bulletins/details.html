<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Bulletin de Notes</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            margin: 30px;
        }

        h2 {
            text-align: center;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            border: 1px solid black;
            padding: 10px;
            text-align: center;
        }

        th {
            background-color: #f2f2f2;
        }

        .success {
            color: green;
            font-weight: bold;
        }

        .danger {
            color: red;
            font-weight: bold;
        }

    </style>

</head>

<body>

<h2>BULLETIN DE NOTES</h2>

<h3>Année Universitaire 2025 - 2026</h3>

<p>
    <b>Étudiant :</b>

    <span th:text="${bulletin.etudiant.nom}"></span>

    <span th:text="${bulletin.etudiant.prenom}"></span>
</p>

<p>
    <b>Groupe :</b>

    <span th:text="${bulletin.etudiant.groupe}"></span>
</p>

<p>
    <b>Filière :</b>

    <span th:text="${bulletin.etudiant.filiere.nom}"></span>
</p>

<hr>

<table>

    <thead>

    <tr>
        <th>Module</th>
        <th>Coefficient</th>
        <th>Note</th>
        <th>Somme</th>
    </tr>

    </thead>

    <tbody>

    <tr th:each="n : ${bulletin.notes}">

        <td th:text="${n.module.nom}"></td>

        <td th:text="${n.module.coefficient}"></td>

        <td th:text="${n.valeur}"></td>

        <td th:text="${n.valeur * n.module.coefficient}"></td>

    </tr>

    </tbody>

</table>

<br>

<p>
    <b>Moyenne Générale :</b>

    <span th:text="${bulletin.moyenneGenerale}"></span>
</p>

<p>
    <b>Mention :</b>

    <span th:text="${bulletin.mention}"></span>
</p>

<p>
    <b>Résultat :</b>

    <span
            th:text="${bulletin.admis} ? 'ADMIS' : 'AJOURNÉ'"
            th:classappend="${bulletin.admis} ? 'success' : 'danger'">
    </span>
</p>

<hr>

<p>
    Ce bulletin est généré automatiquement par le
    Système de Gestion des Étudiants (SGE).
</p>

<br>

<a href="/bulletins">
    ⬅ Retour vers la liste
</a>

</body>
</html>
