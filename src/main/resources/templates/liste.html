<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Liste des Bulletins</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
        }

        h2 {
            text-align: center;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            border: 1px solid black;
            padding: 10px;
            text-align: center;
        }

        th {
            background-color: #f2f2f2;
        }

        .admis {
            background-color: #d4edda;
        }

        .ajourne {
            background-color: #f8d7da;
        }

        a {
            text-decoration: none;
            color: blue;
        }
    </style>
</head>

<body>

<h2>Liste des Bulletins</h2>

<table>

    <thead>
    <tr>
        <th>Nom</th>
        <th>Prénom</th>
        <th>Groupe</th>
        <th>Filière</th>
        <th>Moyenne</th>
        <th>Mention</th>
        <th>Statut</th>
        <th>Détails</th>
    </tr>
    </thead>

    <tbody>

    <tr th:each="b : ${bulletins}"
        th:classappend="${b.admis} ? 'admis' : 'ajourne'">

        <td th:text="${b.etudiant.nom}"></td>

        <td th:text="${b.etudiant.prenom}"></td>

        <td th:text="${b.etudiant.groupe}"></td>

        <td th:text="${b.etudiant.filiere.nom}"></td>

        <td th:text="${b.moyenneGenerale}"></td>

        <td th:text="${b.mention}"></td>

        <td>
            <span th:text="${b.admis} ? 'ADMIS' : 'AJOURNÉ'"></span>
        </td>

        <td>
            <a th:href="@{'/templates/bullettins/bulletins/' + ${b.etudiant.id}}">
                Voir bulletin
            </a>
        </td>

    </tr>

    </tbody>

</table>

</body>
</html>
